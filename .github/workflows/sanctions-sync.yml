name: Sync Monaco Trade Forum sanctions data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the sync (downloads OFAC + UK, normalises, deduplicates)
        run: python3 scripts/build_sanctions_data.py

      - name: Show what changed
        run: |
          echo "--- data/sanctions-list.json entry count ---"
          python3 -c "import json; print(len(json.load(open('data/sanctions-list.json'))['entries']))"
          git diff --stat -- data/ || true

      - name: Commit updated data back to the repo (audit trail)
        run: |
          git config user.name "mtf-sanctions-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/sanctions-list.json data/sanctions-changelog.json
          if git diff --cached --quiet; then
            echo "No changes to commit — sources are unchanged since the last sync."
          else
            git commit -m "Automated sanctions data sync ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Push updated data to Cloudflare Workers KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set -uo pipefail

          # Defensive trim: a pasted secret sometimes carries a trailing
          # newline or space, which silently breaks the request below.
          CF_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')"
          CF_KV_NAMESPACE_ID="$(printf '%s' "$CF_KV_NAMESPACE_ID" | tr -d '[:space:]')"
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')"

          push_key () {
            local key_name="$1"
            local file_path="$2"
            local url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/${key_name}"
            echo "Writing $key_name from $file_path to Workers KV..."
            echo "URL: $url"
            set +e
            http_code=$(curl -sS -v -o /tmp/kv_write_response.json -w '%{http_code}' \
              "$url" \
              -X PUT \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -F "value=@${file_path}" 2>/tmp/kv_curl_stderr.log)
            curl_exit=$?
            set -e
            echo "--- curl stderr/verbose log ---"
            cat /tmp/kv_curl_stderr.log
            echo "--- end curl log ---"
            if [ "$curl_exit" -ne 0 ]; then
              echo "FATAL: curl itself failed (exit code $curl_exit) before getting a response."
              exit 1
            fi
            echo "HTTP status: $http_code"
            echo "--- response body ---"
            cat /tmp/kv_write_response.json || true
            echo ""
            if [ "$http_code" != "200" ]; then
              echo "FATAL: Cloudflare KV write for '${key_name}' returned HTTP ${http_code}."
              exit 1
            fi
            success=$(python3 -c "import json; print(json.load(open('/tmp/kv_write_response.json')).get('success'))")
            if [ "$success" != "True" ]; then
              echo "FATAL: Cloudflare KV write for '${key_name}' reported success=false."
              exit 1
            fi
            echo "OK: ${key_name} written."
          }

          push_key "sanctions-list" "data/sanctions-list.json"
          push_key "sanctions-changelog" "data/sanctions-changelog.json"
